services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: hydrolens-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
